[package]
name = "rebalancer-api"
version = "0.1.0"
edition.workspace = true
publish = false

[dependencies]
rebalancer-db = { path = "../db" }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["postgres"] }
# Not called directly - re-exported by rebalancer-db - but the "serde"
# feature needs enabling somewhere for Uuid path params/response fields to
# (de)serialize, same reasoning as rebalancer-scheduler's own Cargo.toml.
uuid = { version = "1", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "rebalancer-api"
path = "src/bin/api.rs"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
