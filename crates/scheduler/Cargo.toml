[package]
name = "rebalancer-scheduler"
version = "0.1.0"
edition.workspace = true
publish = false

[dependencies]
rebalancer-db = { path = "../db" }
rebalancer-notify = { path = "../notify" }
rebalancer-oracle = { path = "../oracle" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
serde_json = "1"
bigdecimal = "0.4"
# Not called directly - re-exported by rebalancer-db - but the "serde"
# feature needs enabling somewhere for notifications.rs's Uuid to
# serialize into a webhook payload, and Cargo's feature unification
# means declaring it here (same crate+version as rebalancer-db's) is
# enough to turn it on project-wide.
uuid = { version = "1", features = ["serde"] }

[[bin]]
name = "rebalancer-scheduler"
path = "src/bin/scheduler.rs"
